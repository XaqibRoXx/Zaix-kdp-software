[package]
name = "zaxis-kdp"
version = "0.1.0"
description = "Zaxis KDP Windows desktop application"
authors = ["Zaxis"]
edition = "2021"

[lib]
name = "zaxis_kdp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
base64 = "0.22"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
